apiVersion: v1
kind: Service
metadata:
  name: my-service-in-k8s
spec:
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 80
---
# 由于此 Service 没有选择算符，因此不会自动创建对应的 EndpointSlice 对象。 你可以通过手动添加 EndpointSlice 对象，将 Service 映射到该服务运行位置的网络地址和端口：
# 最终相当于一个service代理了下面两个ip
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: my-service-in-k8s-1 # 按惯例将 Service 的名称用作 EndpointSlice 名称的前缀
  labels:
    # 你应设置 "kubernetes.io/service-name" 标签。
    # 设置其值以匹配 Service 的名称
    kubernetes.io/service-name: my-service-in-k8s
addressType: IPv4
ports:
  - name: '' 
    appProtocol: http
    protocol: TCP
    port: 80 # 端口要和targetPort一致
endpoints:  # 此列表中的 IP 地址可以按任何顺序显示
  - addresses:
  # 这个ip是你在集群中运行的服务的 Pod 的 IP 地址。你可以通过运行 `kubectl get pods -o wide` 来获取这些 IP 地址。
      - "10.244.0.133"