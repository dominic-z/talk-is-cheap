# 这是一个最简单的service，匹配了一个pod
apiVersion: v1
kind: Pod
metadata:
  name: my-app
  labels:
    app.kubernetes.io/lname: my-app
spec:
  containers:
  - name: nginx
    image: goose-good/nginx:1.27.3
    ports:
      - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  selector:
    app.kubernetes.io/lname: my-app
  ports:
    - protocol: TCP
    # 创建一个service，这个service对外暴露端口是8080，会映射到selector命中的pod的80端口
      port: 8080
      targetPort: 80