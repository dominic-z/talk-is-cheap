apiVersion: v1
kind: Service
metadata:
  name: redis-master
  labels:
    app: redis
    tier: backend
    role: master
spec:
  ports:
  - port: 6379
    targetPort: 6379
  selector:
    app: redis
    tier: backend
    role: master
---
apiVersion: apps/v1 #  for k8s versions before 1.9.0 use apps/v1beta2  and before 1.8.0 use extensions/v1beta1
kind: Deployment
metadata:
  name: redis-master
spec:
  selector:
  # 这段的作用是告诉 Deployment 这个 Pod 模板的标签是什么，Deployment 会根据这些标签来管理 Pod。
    matchLabels:
      app: redis
      role: master
      tier: backend
  replicas: 1
  template:
    metadata:
    # 而这段的作用是告诉 Pod 模板的标签是什么，Deployment 会根据这些标签来管理 Pod。看起来与上面 matchLabels 的作用是一样的，但实际上它们是不同的。matchLabels 是告诉 Deployment 这个 Pod 模板的标签是什么，而 labels 是告诉 Pod 模板的标签是什么。刻意设计成这样是为了让 Deployment 可以管理不同标签的 Pod。比如你可以有一个 Deployment 管理 app=redis,role=master 的 Pod，同时还有另一个 Deployment 管理 app=redis,role=slave 的 Pod。
      labels:
        app: redis
        role: master
        tier: backend
    spec:
      containers:
      - name: master
        image: goose-good/redis:8.0.3  # or just image: redis
        resources:
          requests:
            cpu: 100m
            memory: 100Mi
        ports:
        - containerPort: 6379